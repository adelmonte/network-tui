[package]
name = "network-tui"
version = "0.3.0"
edition = "2024"
description = "Network manager with a terminal UI: Wi-Fi via iwd, Ethernet, WireGuard, OpenVPN"
license = "GPL-3.0-or-later"
authors = ["adelmonte"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
genetlink = "0.3.1"
libc = "0.2.191"
netlink-packet-core = "0.9"
netlink-packet-generic = "0.5"
netlink-packet-wireguard = "0.5.1"
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }
ratatui = "0.30"
rtnetlink = "0.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "process", "net", "io-util", "fs", "signal"] }
toml = "1.2.3"
toml_edit = "0.25.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.3"
wl-nl80211 = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"

[profile.release]
lto = "thin"
strip = true
